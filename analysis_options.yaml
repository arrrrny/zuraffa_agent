include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Federated Flutter packages — each analyzes in its own context
    # (the root package is pure Dart; spec 115).
    - packages/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    prefer_interpolation_to_compose_strings: ignore
    unnecessary_parenthesis: ignore
    # Re-enabled as `warning` (issue #116) — a dropped import must surface
    # in `dart analyze` output instead of being silenced outright.
    unused_import: warning

linter:
  rules:
    - always_declare_return_types
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_parenthesis
    # Hardened set (issue #116) — stricter than lints/recommended:
    - avoid_dynamic_calls
    - require_trailing_commas
    - prefer_const_constructors
    - prefer_const_declarations
    - directives_ordering
    - sort_pub_dependencies
    - public_member_api_docs
    - lines_longer_than_80_chars
