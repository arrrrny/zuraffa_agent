# Static analysis for the zfa-native zuraffa_agent package (issue #204).
#
# The package is a clean-break rebuild scaffolded by `zfa package create`, so
# it keeps the strict type-checking the engine repo valued (strict-casts /
# inference / raw-types) while using the lint set generated Zorphy entities
# already satisfy — the model layer is generated (constitution IX) and must not
# be hand-edited to chase doc/line lints. `dart analyze --fatal-infos` is the
# CI gate (pipeline.yml) and passes against this config.
include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Federated Flutter packages — each analyzes in its own context.
    - packages/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    # A dropped import must surface in `dart analyze` instead of being
    # silenced outright.
    unused_import: warning

linter:
  rules:
    - avoid_empty_else
    - avoid_redundant_argument_values
    - empty_statements
    - unnecessary_const
    - unnecessary_new