# zuraffa_agent — a thin, zfa-native Zuraffa wrapper around pi (issue #204).
#
# Next-major clean break (architecture plan §7): the package no longer ships
# its own agent loop, provider clients, transcript store, or compaction. pi
# owns all of that; this package contributes only the generic Zuraffa
# integration — DI, lifecycle, host-injection ports, and the one
# extension-installation seam composed into pi's real AgentOptions hooks.
name: zuraffa_agent
description: >-
  A thin, zfa-native Zuraffa wrapper around pi: opens a pi runtime from
  injected host configuration, installs Zuraffa capability extensions through
  one seam, and returns pi's own conversations, submissions, watches, tasks,
  and outcomes. pi owns every agent loop, provider call, transcript, and
  durable scheduler; this package carries none of them.
version: 8.0.0
homepage: https://zuraffa.com
documentation: https://github.com/arrrrny/zuraffa_agent#readme
repository: https://github.com/arrrrny/zuraffa_agent
issue_tracker: https://github.com/arrrrny/zuraffa_agent/issues
topics:
  - agent
  - llm
  - ai
  - zuraffa
  - pi

environment:
  sdk: ^3.11.0

dependencies:
  # pi owns the agent runtime this package wraps (issue #204, FR-004/FR-005).
  pi: ^0.2.0
  zuraffa: ^7.6.1
  zorphy: ^2.5.1
  zorphy_annotation: ^2.5.1
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.25.0