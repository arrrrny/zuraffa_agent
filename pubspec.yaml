name: zuraffa_agent
description: The agent engine of the Zuraffa ecosystem.
publish_to: none

environment:
  sdk: ^3.8.0

dependency_overrides:
  analyzer: 14.1.0
  zorphy:
    path: ../zorphy/zorphy
  zorphy_annotation:
    path: ../zorphy/zorphy_annotation

dependencies:
  hive_ce: ^2.19.0
  http: ^1.2.0
  json_annotation: ^4.12.0
  json_schema: ^5.0.0
  uuid: ^4.5.1
  zorphy_annotation: ^2.1.0
  zuraffa:
    path: ../zuraffa

dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.25.0
