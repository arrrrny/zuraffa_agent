name: zuraffa_agent
description: >-
  The agent engine of the Zuraffa ecosystem: missions, sessions, tool and
  MCP orchestration, eval harness, and event-driven observability for
  building type-safe AI agents.
version: 7.3.2
homepage: https://zuraffa.com
documentation: https://github.com/arrrrny/zuraffa_agent#readme
repository: https://github.com/arrrrny/zuraffa_agent
issue_tracker: https://github.com/arrrrny/zuraffa_agent/issues
topics:
  - agent
  - llm
  - mcp
  - ai
  - zuraffa

environment:
  sdk: ^3.8.0

dependencies:
  hive_ce: ^2.19.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  path: ^1.9.0
  synchronized: ^3.4.2
  uuid: ^4.6.0
  yaml: ^3.1.4
  zorphy_annotation: ^2.0.0
  zuraffa: ^7.3.2

dev_dependencies:
  build_runner: ^2.16.0
  coverage: ^1.15.1
  # dartdoc for API-doc generation (issue #114 asks for ^8.x). Every
  # dartdoc <=8.x needs analyzer <=7.x while zuraffa 7.3.0 pins analyzer
  # ^14.4.0, so ^8.x cannot resolve here — ^9 is the documented deviation.
  dartdoc: ^9.0.11
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  mutation_test: ^1.8.0
  test: ^1.25.0
