name: zuraffa_agent_ios
description: >-
  iOS implementation of the zuraffa_agent AgentPlatform seam:
  Application Support home + Keychain secure store.
version: 7.3.2
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_agent

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ZuraffaAgentPlugin
        podspec: ios/zuraffa_agent_ios.podspec

dependencies:
  flutter:
    sdk: flutter
  zuraffa_agent: ^7.3.2
  zuraffa_agent_platform_interface: ^7.3.2

dependency_overrides:
  # Fleet-wide xml policy: pin the override to the latest xml so graphs
  # that still transitively pull the abandoned minio (xml 6.x) resolve
  # cleanly.
  xml: 7.1.0
