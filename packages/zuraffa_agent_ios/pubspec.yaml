name: zuraffa_agent_ios
description: >-
  iOS implementation of the zuraffa_agent AgentPlatform seam:
  Application Support home + Keychain secure store.
version: 0.1.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_agent

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ZuraffaAgentPlugin
        podspec: ios/zuraffa_agent_ios.podspec

dependencies:
  flutter:
    sdk: flutter
  zuraffa_agent:
    path: ../..
  zuraffa_agent_platform_interface:
    path: ../zuraffa_agent_platform_interface
