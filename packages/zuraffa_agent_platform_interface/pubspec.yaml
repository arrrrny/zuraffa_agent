name: zuraffa_agent_platform_interface
description: >-
  Method-channel implementation of the zuraffa_agent AgentPlatform seam
  for Android, iOS and macOS hosts.
version: 7.3.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_agent

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

flutter:
  # Dart-only federated interface: the android/ios/macos packages carry
  # the native plugin declarations.

dependencies:
  flutter:
    sdk: flutter
  zuraffa_agent: ^7.3.0

dependency_overrides:
  # Local development only — resolve the sibling to this checkout; pub
  # strips this at publish time.
  zuraffa_agent:
    path: ../..

  xml: 7.1.0
  zuraffa:
    path: ../../../zuraffa
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
