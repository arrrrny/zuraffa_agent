name: zuraffa_agent_macos
description: >-
  macOS implementation of the zuraffa_agent AgentPlatform seam:
  Application Support home + Keychain secure store.
version: 0.1.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_agent
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: ZuraffaAgentPlugin
        podspec: macos/zuraffa_agent_macos.podspec

dependencies:
  flutter:
    sdk: flutter
  zuraffa_agent: ^0.5.0
  zuraffa_agent_platform_interface: ^0.1.0
