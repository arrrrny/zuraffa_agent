name: zuraffa_agent_android
description: >-
  Android implementation of the zuraffa_agent AgentPlatform seam:
  filesDir home + Android Keystore (AES/GCM) secure store.
version: 7.2.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_agent

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.zuraffa.zuraffa_agent_android
        pluginClass: ZuraffaAgentAndroidPlugin

dependencies:
  flutter:
    sdk: flutter
  zuraffa_agent: ^7.2.0
  zuraffa_agent_platform_interface: ^7.2.0

dependency_overrides:
  # Local development only — resolve the siblings to this checkout; pub
  # strips these at publish time.
  zuraffa_agent:
    path: ../..
  zuraffa_agent_platform_interface:
    path: ../zuraffa_agent_platform_interface

  xml: 7.1.0