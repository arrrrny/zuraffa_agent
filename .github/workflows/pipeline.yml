name: spec-pipeline

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec slug to run the pipeline for (empty = verify-only)"
        required: false
        default: ""

concurrency:
  # One run per PR ref: superseded runs are cancelled instead of piling up.
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Formatter gate — named distinctly from `analyze` so a formatting
    # failure is immediately identifiable in the PR checks list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the SDK the tree was formatted with (3.13.7): the
          # moving `stable` channel's formatter could drift and fail this
          # gate with zero code changes. The `verify` matrix keeps riding
          # stable/beta — testing both channels is its point.
          sdk: 3.13.7
      # dart format reads the package config to learn the package's
      # language version (tall style); without `pub get` it falls back to
      # a lower default and disagrees with the committed formatting.
      - name: Pub get
        run: dart pub get
      - name: Enforce dart format
        # Scope mirrors the tree-wide reformat wherever it can resolve on
        # this pure-Dart runner. packages/** is deliberately excluded: the
        # federated subpackage analyzes in its own context
        # (analysis_options.yaml) and its pubspec needs flutter plus a
        # path: sibling checkout, so it cannot resolve here.
        run: dart format --output=none --set-exit-if-changed lib test tool example

  verify:
    # CI gate for every PR: analyze + test the engine on supported SDKs
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      # setup-dart@v1 has no built-in cache input, so cache ~/.pub-cache
      # explicitly (issue #112).
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ matrix.sdk }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ matrix.sdk }}-
      - name: Pub get
        run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        # Fleet guard (AGENTS.md): cap test concurrency at 2 — matches
        # dart_test.yaml's concurrency: 2; the flag keeps CI explicit.
        run: dart test -j 2
      - name: Runtime purity gate (no dart:io in engine runtime paths)
        run: |
          # Engine purity (constitution VII): dart:io is allowed ONLY in the
          # interface-backed I/O adapters listed below. Any new file that
          # imports dart:io fails this gate until it is consciously reviewed
          # and added here with a justification.
          #
          # The grep matches import/export DIRECTIVES only — not raw text.
          # Matching the bare string "dart:io" was a false-positive factory:
          # pure-Dart files whose doc comments explain they do NOT use
          # dart:io (e.g. llm_clock.dart, llm_transport.dart) tripped the
          # gate on master after the spec-007 stack merged.
          ALLOWED="lib/src/execution_env.dart
          lib/src/hive_session_store.dart
          lib/src/session_storage_impl.dart
          lib/src/jsonl_session_storage.dart
          lib/src/prompt_templates.dart
          lib/src/skills.dart
          lib/src/llm/io_llm_transport.dart
          lib/src/mcp/io_sse_mcp_transport.dart
          lib/src/mcp/io_stdio_mcp_transport.dart
          # LlmHttpTransport: the LlmClient I/O boundary. A real LLM call on the
          # Dart VM requires an HTTP client, and proxy egress (HTTP CONNECT
          # through http://localhost:8890) requires dart:io's HttpClient.findProxy.
          # Pure request-build / response-parse helpers are unit-tested without
          # network; only this adapter touches platform I/O. (spec 065)
          # JsonlEntityStorage: generic durable JSONL adapter for datasources
          # that need local persistence (turn records, tool invocations, usage
          # ledger). dart:io is confined here per Constitution VII; production
          # datasources delegate I/O to this adapter instead of importing
          # dart:io directly. (spec 065)
          lib/src/data/datasources/jsonl_entity_storage.dart
          lib/src/data/providers/llm_client/llm_http_transport.dart
          # PersistentAgentMemory: spec-076 file-backed memory stores —
          # atomic JSON snapshots on local disk (write *.tmp, rename over
          # target). Missed the allowlist when spec 076 landed (the gate
          # was not run on that merge); added with justification by spec
          # 105 / issue #107, which requires this gate green. (spec 076)
          lib/src/engine/persistent_agent_memory.dart
          # SessionLock: spec-114 advisory single-writer sidecar lock for
          # session stores — takes an exclusive non-blocking OS lock on a
          # .lock sidecar next to the store path. Missed the allowlist
          # when spec 114 landed (the gate is not run on pushes to
          # master); an interface-backed adapter like
          # jsonl_session_storage.dart. (spec 114)
          lib/src/session_backup.dart
          lib/src/session_lock.dart
          # TiktokenEstimator.load: one-time setup read of a .tiktoken rank
          # file (issue #138). The TokenEstimator contract stays pure and
          # synchronous — rank tables are loaded up front, never on the
          # pre-flight hot path; same shape as the skills.dart /
          # prompt_templates.dart setup-time loads already listed. Missed
          # the allowlist when the PR landed (the gate runs on pull_request
          # only, so no master push ever tripped it). (issue #138 / PR #151)
          lib/src/llm/token_estimator.dart
          # JsonlAuditSink: issue #132 append-only audit trail's file
          # adapter — the AuditSink contract (audit_log.dart) stays pure
          # and owns no dart:io; this file owns the FileMode.append I/O.
          # Same shape as the allowlisted jsonl_entity_storage.dart /
          # jsonl_session_storage.dart JSONL adapters. Missed the
          # allowlist when the PR landed (the gate runs on pull_request
          # only). (issue #132 / PR #158)
          lib/src/security/jsonl_audit_sink.dart"
          BAD=0
          while IFS= read -r f; do
            if ! printf '%s\n' "$ALLOWED" | grep -qxF "$f"; then
              echo "::error::dart:io import in non-adapter file: $f"
              BAD=1
            fi
          done < <(grep -rlE "^[[:space:]]*(import|export)[[:space:]]+['\"]dart:io" lib/src/ --include="*.dart" || true)
          if [ "$BAD" -ne 0 ]; then exit 1; fi
          echo "Purity gate clean: dart:io confined to $(printf '%s\n' "$ALLOWED" | grep -c .) allowlisted adapters."
      - name: Attribution gate (ported sources carry MIT notices)
        run: |
          if find lib -name "*.dart" -newer NOTICE 2>/dev/null | head -1 | grep -q . && ! grep -qr "dart_agent_core\|pi_agent\|Zechner\|Memex" lib/; then
            echo "::warning::No attribution markers found — verify no unattributed ports landed"
          fi

  coverage:
    # Issue #113: measure lib/ line coverage on every PR, publish lcov.info
    # as an artifact, and gate on a minimum threshold. Runs as its own job
    # (not inside the verify matrix) so the expensive coverage tracing runs
    # once on the pinned SDK instead of once per matrix leg.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned like the format gate: the coverage package's VM coverage
          # output is SDK-sensitive, so the measured number should not drift
          # with the stable channel.
          sdk: 3.13.7
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-3.13.7-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-3.13.7-
      - name: Pub get
        run: dart pub get
      - name: Test with coverage (issue #113)
        run: dart test -j 2 --coverage=coverage
      - name: Format lcov (issue #113)
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Coverage gate — min 80% over hand-written lib/ (issue #113)
        # Baseline measured with the pinned 3.13.7 SDK when the gate landed
        # (issue #113 "after baseline measurement"):
        #   hand-written lib/  86.32%  (7400/8573)  <- gated, floor 80
        #   generated          18.55%  ( 598/3224)  <- reported, not gated
        #   total lib/         67.80%  (7998/11797)
        # Generated = committed build_runner output (*.g.dart, *.zorphy.dart);
        # it is never hand-edited in this repo, so the 80% gate applies to
        # hand-written lines and the tool prints the other two numbers for
        # visibility.
        run: dart run tool/check_coverage.dart coverage/lcov.info 80
      - name: Upload lcov.info artifact (issue #113)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Codecov upload (advisory, issue #113 optional AC)
        # Optional by the issue ("optional Codecov/coveralls"): the org has
        # no CODECOV_TOKEN yet, so this is non-blocking and the empty-token
        # upload is allowed to fail silently.
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  pana:
    # Issue #114 AC-2: pana on pull requests as a NON-BLOCKING advisory —
    # surfaces the pub.dev score (scoring parity) in the PR checks
    # without gating merges. `stable` on purpose: pub.dev itself scores
    # with the current stable toolchain, so this mirrors what a future
    # publish would see. Flip continue-on-error to false once the score
    # is worth gating on.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Pub get
        run: dart pub get
      - name: Pana — pub.dev scoring parity (advisory, non-blocking)
        run: |
          dart pub global activate pana 0.23.19 # bump deliberately; advisory only (misfire #165: activate takes the version as a separate arg — pana:0.23.19 is not a valid package name)
          dart pub global run pana:pana

  osv-scanner:
    # Issue #114 AC-4 (optional): advisory vulnerability scan over the
    # COMMITTED pubspec.lock — the lockfile is what makes the scan
    # reproducible (the #3 dependency: no lockfile, no meaningful
    # advisories). Pinned binary; non-blocking like pana, flip
    # continue-on-error to false to gate on published advisories.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner (pinned v2.7.0)
        run: |
          curl -fsSL -o osv-scanner_linux_amd64 \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          curl -fsSL -o osv-scanner_SHA256SUMS \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_SHA256SUMS
          grep 'osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          mv osv-scanner_linux_amd64 osv-scanner
          chmod +x osv-scanner
      - name: Scan pubspec.lock (advisory)
        run: ./osv-scanner scan source --lockfile pubspec.lock

  pipeline:
    # Manual dispatch: run the full spec chain for one spec
    if: github.event_name == 'workflow_dispatch' && inputs.spec != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Pub get
        run: dart pub get
      - name: Run spec pipeline
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          chmod +x scripts/*.sh .specify/scripts/bash/*.sh 2>/dev/null || true
          ./scripts/pipeline.sh "${{ inputs.spec }}"
      - name: Upload pipeline state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state-${{ inputs.spec }}
          path: .workflow/state/
          if-no-files-found: ignore
