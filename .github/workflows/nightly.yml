name: nightly-verification

# Issue #128 — mutation, load/benchmark, and fixture-drift verification.
#
# NON-BLOCKING by design: every gate step carries `continue-on-error: true`
# so a red nightly never blocks a PR or a merge (the nightly cannot gate
# pull_requests anyway — it runs on a schedule). Each job still surfaces a
# red X on the failing step and publishes its numbers as artifacts under
# `if: always()` so a regression is visible and diffable, not silent.
#
# PR-gate equivalents: the snapshot/property suites run in the normal
# pipeline (`dart test -j 2`); the curated mutant registry doubles as an
# on-demand check via `dart run tool/mutation_rubric.dart --filter <id>`.

on:
  schedule:
    # 02:30 UTC daily — off-peak for the mostly-US/EU commit history.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  # One nightly run at a time; a scheduled run supersedes a still-running one.
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the SDK the tree is formatted/analyzed with (matches the
  # format gate in pipeline.yml).
  DART_SDK: '3.13.7'

jobs:
  mutation:
    # AC-1: dmuti nightly over the pure-function wire/state zone with the
    # >= 80% mutant-kill-rate gate (mutation/dmuti_targets.xml
    # <threshold failure="80">), PLUS the formalized manual mutant rubric
    # (tool/mutation_rubric.dart) anchoring the historically-surviving
    # mutant classes from specs/ROLLUP_VERIFICATION.md.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Pub get
        run: dart pub get
      - name: dmuti mutation run (>= 80% kill-rate gate)
        continue-on-error: true
        run: |
          dart run mutation_test --rules mutation/dmuti_rules.xml \
            mutation/dmuti_targets.xml -o mutation-test-report
      - name: Formalized manual mutant rubric (>= 80% kill-rate gate)
        continue-on-error: true
        run: dart run tool/mutation_rubric.dart --report mutation-rubric-report.json
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            mutation-test-report/
            mutation-rubric-report.json
          if-no-files-found: ignore

  load:
    # AC-4: load benchmarks — JSONL session append at 1k/10k/100k,
    # MissionRunner 50-tool-call wall-clock, FallbackChainClient failover
    # latency. Numbers publish as JSON artifacts for cross-run comparison.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.DART_SDK }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.DART_SDK }}-
      - name: Pub get
        run: dart pub get
      - name: Run load benchmarks
        continue-on-error: true
        run: dart run benchmark/benchmark_runner.dart --json benchmark-results.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore

  fixture-drift:
    # AC-3 (second half): re-fetch the providers' machine-readable API
    # references and detect wire-format drift against the pinned keys —
    # before the contract tests start failing obscurely.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Pub get
        run: dart pub get
      - name: Check LLM fixture drift against provider docs
        continue-on-error: true
        run: |
          dart run tool/check_llm_fixture_drift.dart --report fixture-drift-report.json
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-drift-report
          path: fixture-drift-report.json
          if-no-files-found: ignore

  integration:
    # Issue #113: the live-LLM lane. The KIMI_API_KEY-gated tests under
    # test/integration/ self-skip in every PR run (secrets are not available
    # to pull_request workflows), so without this job the live provider path
    # was perpetually unverified. `-P integration` selects the tagged
    # integration tier (dart_test.yaml presets); with the operator's secrets
    # unset the tests still self-skip with a stated reason (spec 106: no
    # default gateway), so this lane is safe to schedule unconditionally.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.DART_SDK }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.DART_SDK }}-
      - name: Pub get
        run: dart pub get
      - name: Integration tests (-P integration, live LLM lane)
        # Advisory by the nightly convention (`continue-on-error: true`, as
        # on every gate step here), so the job's status carries no signal on
        # its own. The siblings (`mutation`, `load`, the drift lane) publish
        # their numbers as artifacts under `if: always()`; this lane does the
        # same with its log, so "skipped because the secrets are unset",
        # "ran and passed" and "ran and failed" are distinguishable from the
        # artifact list instead of only from a red step buried in the log.
        continue-on-error: true
        # `shell: bash` is required, not cosmetic: it is what makes the
        # runner use `-eo pipefail`, so `| tee` cannot mask the test exit
        # status. Without it the step would pass on a real failure and the
        # artifact would be the only trace.
        shell: bash
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          dart test -j 2 -P integration --reporter=expanded \
            2>&1 | tee integration-tests.log
      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-log
          path: integration-tests.log
          if-no-files-found: ignore

  eval:
    # Issue #115: nightly eval suite run.
    # Runs golden mission suites against real models and gates on pass@k >= threshold.
    # Runs on schedule and manual dispatch. Skips cleanly without LLM_API_KEY.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.DART_SDK }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.DART_SDK }}-
      - name: Pub get
        run: dart pub get
      - name: Run eval suites (gated on LLM_API_KEY)
        continue-on-error: true
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "LLM_API_KEY not in the environment - skipping eval suite run"
          else
            set -o pipefail
            dart run tool/run_eval_suites.dart 2>&1 | tee eval-suite-results.log
          fi
      - name: Upload eval results log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-suite-results-log
          path: eval-suite-results.log
          if-no-files-found: ignore
