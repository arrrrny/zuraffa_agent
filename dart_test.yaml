# dart_test.yaml — generated by `zfa setup`, hand-tuned (issues #835, #140).
# Configures the dart/flutter test runner.

color: true
concurrency: 4
timeout: 30s
retry: 0
pause_after_load: false

# Test tiers (bug #835, tightened by issue #140): the default run is the UNIT
# lane — slow tests are excluded and integration-tagged tests are SKIPPED
# with a stated reason instead of silently running. The integration tier is
# first-class through its own preset (serial — concurrency 1):
#
#   dart test                    # unit lane (fast, concurrency 4)
#   dart test -P integration     # integration lane (serial, concurrency 1)
#
# Every integration test carries @Tags(['integration']); the tag is declared
# below so a test using one never prints the unspecified-tag warning.
tags:
  slow:
  integration:
    skip: "integration tier — run with: dart test -P integration"

exclude_tags: slow

presets:
  integration:
    include_tags: integration
    exclude_tags: "false"
    concurrency: 1
    # The preset un-skips the tag the default lane skips (issue #140):
    # inside this preset the integration tier runs for real.
    tags:
      integration:
        skip: false
